name: CI — Build, Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─── Lint & Unit Tests — Node.js ────────────────────────────────────────────
  lint-test-node:
    name: Lint & Test — Node.js Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ui-frontend, ui-backend, course-catalog, live-session, credits-currency, enrollment, payment, notification]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm install --legacy-peer-deps

      - name: Check syntax
        working-directory: services/${{ matrix.service }}
        run: |
          echo "Checking JS syntax for ${{ matrix.service }}..."
          find src -name "*.js" -not -path "*/node_modules/*" | xargs -I{} node --check {} 2>&1 && echo "Syntax OK" || true
        continue-on-error: true

  # ─── Lint & Unit Tests — Python ─────────────────────────────────────────────
  lint-test-python:
    name: Lint & Test — Python (learning-path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: services/learning-path
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: pip install ruff && ruff check services/learning-path/src
        continue-on-error: true

  # ─── Lint & Unit Tests — Go ──────────────────────────────────────────────────
  lint-test-go:
    name: Lint & Test — Go (assessment-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: true

      - name: Download modules
        working-directory: services/assessment-engine
        run: go mod download

      - name: Vet
        working-directory: services/assessment-engine
        run: go vet ./src/...
        continue-on-error: true

  # ─── Docker Build ────────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-test-node, lint-test-python, lint-test-go]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ui-frontend
            context: services/ui-frontend
          - service: ui-backend
            context: services/ui-backend
          - service: course-catalog
            context: services/course-catalog
          - service: learning-path
            context: services/learning-path
          - service: assessment-engine
            context: services/assessment-engine
          - service: live-session
            context: services/live-session
          - service: credits-currency
            context: services/credits-currency
          - service: enrollment
            context: services/enrollment
          - service: payment
            context: services/payment
          - service: notification
            context: services/notification
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Security Scan ───────────────────────────────────────────────────────────
  security-scan:
    name: Security — Trivy Scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
