apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillfyme-ingress
  namespace: skillfyme
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.skillfyme.com
        - api.skillfyme.com
      secretName: skillfyme-tls
  rules:
    - host: app.skillfyme.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui-frontend
                port:
                  number: 3000
    - host: api.skillfyme.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui-backend
                port:
                  number: 4000
