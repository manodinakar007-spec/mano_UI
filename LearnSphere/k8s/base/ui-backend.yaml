apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-backend
  namespace: skillfyme
  labels:
    app: ui-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui-backend
  template:
    metadata:
      labels:
        app: ui-backend
        version: v1
    spec:
      containers:
        - name: ui-backend
          image: ghcr.io/skillfyme/ui-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: skillfyme-config
            - secretRef:
                name: skillfyme-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ui-backend
  namespace: skillfyme
spec:
  selector:
    app: ui-backend
  ports:
    - port: 4000
      targetPort: 4000
