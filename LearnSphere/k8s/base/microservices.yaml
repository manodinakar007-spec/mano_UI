# ─── Course Catalog ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-catalog
  namespace: skillfyme
  labels:
    app: course-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: course-catalog
  template:
    metadata:
      labels:
        app: course-catalog
    spec:
      containers:
        - name: course-catalog
          image: ghcr.io/skillfyme/course-catalog:latest
          ports:
            - containerPort: 9101
          env:
            - name: PORT
              value: "9101"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: skillfyme-secrets
                  key: MONGODB_URI
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 9101 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: course-catalog
  namespace: skillfyme
spec:
  selector:
    app: course-catalog
  ports:
    - port: 9101
      targetPort: 9101
---
