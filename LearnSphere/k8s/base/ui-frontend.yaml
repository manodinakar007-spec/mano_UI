apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-frontend
  namespace: skillfyme
  labels:
    app: ui-frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui-frontend
  template:
    metadata:
      labels:
        app: ui-frontend
        version: v1
    spec:
      containers:
        - name: ui-frontend
          image: ghcr.io/skillfyme/ui-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_BASE_URL
              value: "http://ui-backend:4000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ui-frontend
  namespace: skillfyme
spec:
  selector:
    app: ui-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
